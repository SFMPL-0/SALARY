<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUNRISE FREIGHT MOVERS — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --navy: #0f1f3d;
  --blue: #1e3a5f;
  --accent: #f6c90e;
  --light: #e8f0fe;
  --text: #1a1a2e;
  --muted: #7a8ba0;
  --white: #ffffff;
  --green: #1a7a4a;
  --red: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--navy);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
/* Geometric background */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, #0f1f3d 0%, #1e3a5f 50%, #0d2137 100%);
}
.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(246,201,14,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(246,201,14,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
}
.bg-circle1 {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(41,128,185,0.12) 0%, transparent 70%);
  top: -200px; right: -200px;
}
.bg-circle2 {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(246,201,14,0.06) 0%, transparent 70%);
  bottom: -150px; left: -100px;
}

/* MAIN CARD */
.login-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
  padding: 20px;
}
.login-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5);
  animation: slideUp 0.5s ease;
}
@keyframes slideUp {
  from { opacity:0; transform:translateY(30px); }
  to { opacity:1; transform:translateY(0); }
}
.card-header {
  background: linear-gradient(135deg, var(--accent) 0%, #e8b800 100%);
  padding: 30px 36px 24px;
  text-align: center;
}
.company-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(15,31,61,0.2);
  border-radius: 30px;
  padding: 6px 16px;
  margin-bottom: 12px;
}
.company-badge i { color: var(--navy); font-size: 0.8rem; }
.company-badge span { color: var(--navy); font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.card-header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.9rem;
  font-weight: 800;
  color: var(--navy);
  line-height: 1.1;
  margin-bottom: 4px;
}
.card-header p {
  color: rgba(15,31,61,0.65);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.5px;
}

/* TAB SWITCHER */
.tab-switcher {
  display: flex;
  background: rgba(0,0,0,0.2);
  padding: 6px;
  margin: 24px 36px 0;
  border-radius: 12px;
}
.tab-btn {
  flex: 1;
  padding: 10px;
  background: none;
  border: none;
  border-radius: 8px;
  color: rgba(255,255,255,0.5);
  font-family: 'Barlow', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.tab-btn.active {
  background: var(--accent);
  color: var(--navy);
  box-shadow: 0 4px 12px rgba(246,201,14,0.3);
}

/* FORM */
.card-body { padding: 24px 36px 32px; }
.form-section { display: none; }
.form-section.active { display: block; }

.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 7px;
}
.input-wrap {
  position: relative;
}
.input-wrap i {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.3);
  font-size: 0.85rem;
  pointer-events: none;
}
.input-wrap input, .input-wrap select {
  width: 100%;
  padding: 12px 14px 12px 40px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: #fff;
  font-family: 'Barlow', sans-serif;
  font-size: 0.9rem;
  transition: all 0.2s;
  outline: none;
}
.input-wrap select option { background: #1e3a5f; color: #fff; }
.input-wrap input::placeholder { color: rgba(255,255,255,0.25); }
.input-wrap input:focus, .input-wrap select:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,0.1);
  box-shadow: 0 0 0 3px rgba(246,201,14,0.15);
}

.btn-login {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), #e8b800);
  border: none;
  border-radius: 10px;
  color: var(--navy);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(246,201,14,0.35); }
.btn-login:active { transform: translateY(0); }

.error-msg {
  background: rgba(192,57,43,0.15);
  border: 1px solid rgba(192,57,43,0.4);
  border-radius: 8px;
  padding: 10px 14px;
  color: #ff8a80;
  font-size: 0.82rem;
  margin-bottom: 16px;
  display: none;
  align-items: center;
  gap: 8px;
}
.error-msg.show { display: flex; }

.footer-note {
  text-align: center;
  margin-top: 20px;
  color: rgba(255,255,255,0.2);
  font-size: 0.72rem;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-circle1"></div>
<div class="bg-circle2"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="card-header">
      <div class="company-badge">
        <i class="fas fa-truck"></i>
        <span>Sunrise Freight Movers Pvt Ltd</span>
      </div>
      <h1>Salary &amp;<br>HR Portal</h1>
      <p>Secure Access System · FY 2025-26</p>
    </div>

    <div class="tab-switcher">
      <button class="tab-btn active" onclick="switchTab('admin')" id="tab-admin">
        <i class="fas fa-user-shield"></i> Admin Login
      </button>
      <button class="tab-btn" onclick="switchTab('branch')" id="tab-branch">
        <i class="fas fa-map-marker-alt"></i> Branch Login
      </button>
    </div>

    <div class="card-body">

      <!-- ADMIN LOGIN -->
      <div class="form-section active" id="form-admin">
        <div class="error-msg" id="admin-error"><i class="fas fa-exclamation-circle"></i><span id="admin-error-text"></span></div>
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" id="admin-username" placeholder="Enter username" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="admin-password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
          </div>
        </div>
        <button class="btn-login" onclick="adminLogin()">
          <i class="fas fa-sign-in-alt"></i> SIGN IN TO ADMIN
        </button>
      </div>

      <!-- BRANCH LOGIN -->
      <div class="form-section" id="form-branch">
        <div class="error-msg" id="branch-error"><i class="fas fa-exclamation-circle"></i><span id="branch-error-text"></span></div>
        <div class="form-group">
          <label>Branch</label>
          <div class="input-wrap">
            <i class="fas fa-map-marker-alt"></i>
            <select id="branch-code">
              <option value="">-- Select Your Branch --</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Branch PIN</label>
          <div class="input-wrap">
            <i class="fas fa-key"></i>
            <input type="password" id="branch-pin" placeholder="Enter PIN set by Admin" maxlength="10" onkeydown="if(event.key==='Enter')branchLogin()">
          </div>
        </div>
        <button class="btn-login" onclick="branchLogin()">
          <i class="fas fa-clipboard-check"></i> ACCESS ATTENDANCE
        </button>
      </div>

      <div class="footer-note">SUNRISE FREIGHT MOVERS PVT LTD &nbsp;·&nbsp; Internal System</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Populate branch dropdown
BRANCHES.forEach(b => {
  const o = document.createElement('option');
  o.value = b; o.textContent = b;
  document.getElementById('branch-code').appendChild(o);
});

function switchTab(tab) {
  document.getElementById('tab-admin').classList.toggle('active', tab === 'admin');
  document.getElementById('tab-branch').classList.toggle('active', tab === 'branch');
  document.getElementById('form-admin').classList.toggle('active', tab === 'admin');
  document.getElementById('form-branch').classList.toggle('active', tab === 'branch');
  hideErrors();
}

function hideErrors() {
  document.getElementById('admin-error').classList.remove('show');
  document.getElementById('branch-error').classList.remove('show');
}

function showError(id, msg) {
  const el = document.getElementById(id);
  document.getElementById(id + '-text').textContent = msg;
  el.classList.add('show');
}

async function adminLogin() {
  const username = document.getElementById('admin-username').value.trim();
  const password = document.getElementById('admin-password').value;
  if (!username || !password) { showError('admin-error', 'Please enter username and password.'); return; }

  const { data, error } = await db
    .from('admins')
    .select('*')
    .eq('username', username)
    .eq('password_hash', password)
    .eq('status', 'Active')
    .single();

  if (error || !data) {
    showError('admin-error', 'Invalid username or password.');
    return;
  }
  // Store session
  sessionStorage.setItem('sfm_user', JSON.stringify({ type: 'admin', id: data.id, name: data.full_name, username: data.username, role: data.role }));
  window.location.href = 'admin.html';
}

async function branchLogin() {
  const code = document.getElementById('branch-code').value;
  const pin = document.getElementById('branch-pin').value;
  if (!code) { showError('branch-error', 'Please select your branch.'); return; }
  if (!pin) { showError('branch-error', 'Please enter your PIN.'); return; }

  const { data, error } = await db
    .from('branch_users')
    .select('*')
    .eq('branch_code', code)
    .eq('pin', pin)
    .eq('status', 'Active')
    .single();

  if (error || !data) {
    showError('branch-error', 'Invalid branch or PIN. Contact your admin.');
    return;
  }
  sessionStorage.setItem('sfm_user', JSON.stringify({ type: 'branch', branch: code }));
  window.location.href = 'attendance.html';
}
</script>
</body>
</html>
